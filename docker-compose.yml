# docker-compose.yml

services:
  db:
    image: postgres:15-alpine
    container_name: sinapi_db
    hostname: db
    env_file: .env
    environment:
      POSTGRES_MULTIPLE_DATABASES: sinapi,kong
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/db/multiple-databases.sh:/docker-entrypoint-initdb.d/multiple-databases.sh
      # Extensões da busca por relevância (só roda quando o volume do banco é criado).
      - ./docker/db/busca-trigram.sql:/docker-entrypoint-initdb.d/busca-trigram.sql:ro
    #ports:
    #  - "127.0.0.1:5432:5432"
    restart: unless-stopped
    networks:
      - sinapi-net
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$POSTGRES_PASSWORD psql -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    container_name: sinapi_api
    build: .
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      REDIS_HOST: redis
      PG_HOST: db  # usado pelo ETL (autosinapi); o padrão dele é o servidor do autor
    volumes:
      - ./autosinapi_downloads:/app/downloads
    # Acesso direto para o ERP, só pela máquina local. A 8000 fica para a API de licitações.
    ports:
      - "127.0.0.1:8200:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sinapi-net

  redis:
    image: redis:7-alpine
    container_name: sinapi_redis
    restart: unless-stopped
    networks:
      - sinapi-net

  celery_worker:
    build: .
    container_name: sinapi_worker
    command: celery -A api.tasks.celery_app worker --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      REDIS_HOST: redis
      PG_HOST: db
    volumes:
      - ./autosinapi_downloads:/app/downloads
    depends_on:
      - redis
      - db
    restart: unless-stopped
    networks:
      - sinapi-net

  # Kong só sobe com `docker compose --profile gateway up -d` (exposição pública).
  # O ERP acessa a API direto na 8200 e guarda a chave no próprio backend.
  kong-migrations:
    #image: kong:3.4
    build: ./kong/
    profiles: ["gateway"]
    container_name: kong_migrations
    env_file: .env
    environment:
      KONG_DATABASE: postgres
      KONG_PG_DATABASE: kong
      KONG_PG_HOST: db
    command:
      - /bin/sh
      - -ec
      - |
        sh /usr/local/bin/ensure-kong-db.sh
        echo 'Kong database credentials are ready. Running Kong migrations...'
        if kong migrations bootstrap; then
          echo 'Kong database bootstrapped.'
        else
          echo 'Kong database already bootstrapped. Applying pending migrations...'
          kong migrations up
          kong migrations finish
        fi
        kong config db_import /usr/local/kong/declarative/kong.yml
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - sinapi-net
    volumes:
      - ./kong:/usr/local/kong/declarative
      - ./docker/db/ensure-kong-db.sh:/usr/local/bin/ensure-kong-db.sh:ro

  kong:
    #image: kong:3.4
    build: ./kong/
    profiles: ["gateway"]
    container_name: sinapi_gateway
    env_file: .env
    environment:
      KONG_DATABASE: postgres
      KONG_PG_DATABASE: kong
      KONG_PG_HOST: db
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    depends_on:
      kong-migrations:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
      # Admin API disponível somente no host local.
      - "127.0.0.1:8001:8001"
    restart: unless-stopped
    networks:
      - sinapi-net
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # tunnel:
  #   image: cloudflare/cloudflared:latest
  #   command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
  #   restart: unless-stopped
  #   container_name: cloudflared_tunnel


volumes:
  postgres_data:
    driver: local

networks:
  sinapi-net:
    driver: bridge
